<body>
<canvas id="gl"></canvas>

<div id="lang-gate">
  <div class="consent-panel">
    <div id="lang-boot" aria-live="polite"></div>
    <div class="lang-actions">
      <button type="button" class="btn-enter" data-lang="ru" lang="ru">Русский</button>
      <button type="button" class="btn-enter" data-lang="en" lang="en">English</button>
    </div>
  </div>
</div>

<div id="cookie-gate" class="hidden">
  <div class="consent-panel">
    <div id="cookie-boot" aria-live="polite"></div>
    <p class="consent-copy" data-i18n="consentCopy"></p>
    <div class="consent-actions">
      <button type="button" id="btn-consent" class="btn-enter" data-i18n="consentBtn"></button>
      <a href="privacy.html" data-i18n-href="privacy.html" target="_blank" rel="noopener" class="privacy-link" data-i18n="privacyLink"></a>
    </div>
  </div>
</div>

<div id="welcome" class="hidden">
 <div class="welcome-col">
  <h1><button type="button" id="wordmark" class="wordmark">CONSPACE ROOMS</button></h1>
  <p class="statement" data-i18n="statement"></p>

  <section class="about">
    <h2 data-i18n="aboutTitle"></h2>
    <p data-i18n="aboutText"></p>
    <h2 data-i18n="expectTitle"></h2>
    <ul class="expect" data-i18n-list="expect"></ul>
  </section>

  <div class="credits-panel">
    <h2 data-i18n="credits"></h2>
    <div class="artist">
      <p class="role" data-i18n="role1"></p>
      <p class="name">Sinaida</p>
      <p data-i18n="bio1"></p>
      <div class="links">
        <a href="https://sinaida.eu/" target="_blank" rel="noopener">sinaida.eu</a>
        <a href="https://www.instagram.com/sin.ai.da" target="_blank" rel="noopener">@sin.ai.da</a>
      </div>
    </div>
    <div class="artist">
      <p class="role" data-i18n="role2"></p>
      <p class="name" data-i18n="name2"></p>
      <p data-i18n="bio2"></p>
      <div class="links">
        <a href="https://uvaliss.ru/" target="_blank" rel="noopener">uvaliss.ru</a>
        <a href="https://www.instagram.com/uvaliss/" target="_blank" rel="noopener">@uvaliss</a>
      </div>
    </div>
  </div>

  <div id="boot-sequence" aria-live="polite"></div>
  <p id="capability-result" class="capability hidden"></p>

  <div id="mode-select" class="hidden">
    <button type="button" data-mode="light"><span data-i18n="modeLight"></span><span class="mode-legend" data-i18n="legendLight"></span></button>
    <button type="button" data-mode="keys"><span data-i18n="modeKeys"></span><span class="mode-legend" data-i18n="legendKeys"></span></button>
    <button type="button" data-mode="hands" class="mode-secondary"><span data-i18n="modeHands"></span><span class="mode-legend" data-i18n="legendHands"></span></button>
  </div>
  <div id="gesture-note" class="gesture-note">

    <ul class="expect" data-i18n-list="gestureList"></ul>
    <p class="gesture-privacy" data-i18n="gesturePrivacy"></p>
  </div>

  <div class="welcome-actions">
    <button type="button" id="btn-enter" class="btn-enter hidden" data-i18n="enter"></button>
  </div>
  <footer id="site-footer"></footer>
 </div>
</div>

    </div>

  </div>
</div>
